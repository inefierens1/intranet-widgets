<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; }
    /* iOS vergroot tekst in iframes automatisch: uitschakelen */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { font-family: 'Calibri', 'Segoe UI', sans-serif; overflow: hidden; }

    .cvo-knoppen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; background: transparent; padding: 0; }
    .cvo-office-knop { display: flex; align-items: center; gap: 0.9rem; min-height: 78px; padding: 0.9rem 1rem; background-color: #f7f8f6; border: 1px solid #d8d8d8; cursor: pointer; text-decoration: none; color: #000000; position: relative; overflow: hidden; transition: background-color 0.18s ease; }
    .cvo-office-knop:hover, .cvo-office-knop:focus-visible { background-color: #e4e6e4; }
    .cvo-office-knop:focus-visible { outline: 2px solid #4d5554; outline-offset: -2px; }
    .cvo-office-knop::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }

    /* Merkkleuren — linkerbalk */
    .cvo-knop-roze::before  { background-color: #a28790; }
    .cvo-knop-groen::before { background-color: #889a91; }
    .cvo-knop-paars::before { background-color: #4a4247; }
    .cvo-knop-blauw::before { background-color: #5e91a5; }

    /* Hexagon-vulling per kleur (pastel) */
    .cvo-knop-roze  .cvo-hex-icon polygon.hex-bg { fill: #dacfd3; }
    .cvo-knop-groen .cvo-hex-icon polygon.hex-bg { fill: #ced7d2; }
    .cvo-knop-paars .cvo-hex-icon polygon.hex-bg { fill: #c8c6c7; }
    .cvo-knop-blauw .cvo-hex-icon polygon.hex-bg { fill: #b3cdc5; }


    /* Knoppen Mijn Office 365 */
    .cvo-knop-outlook::before, .cvo-knop-teams::before { background-color: #a28790; }
    .cvo-knop-agenda::before     { background-color: #889a91; }
    .cvo-knop-onedrive::before   { background-color: #4a4247; }
    .cvo-knop-sharepoint::before { background-color: #5e91a5; }
    .cvo-knop-outlook .cvo-hex-icon polygon.hex-bg, .cvo-knop-teams .cvo-hex-icon polygon.hex-bg { fill: #dacfd3; }
    .cvo-knop-agenda .cvo-hex-icon polygon.hex-bg     { fill: #ced7d2; }
    .cvo-knop-onedrive .cvo-hex-icon polygon.hex-bg   { fill: #c8c6c7; }
    .cvo-knop-sharepoint .cvo-hex-icon polygon.hex-bg { fill: #b3cdc5; }
    .cvo-knop-sub { font-size: 0.73rem; color: #999999; margin-top: 0.15rem; font-weight: 300; }

    .cvo-hex-wrapper { flex-shrink: 0; width: 48px; height: 48px; }
    .cvo-hex-icon { display: block; width: 100%; height: 100%; }
    .cvo-knop-tekst { display: flex; flex-direction: column; min-width: 0; }
    .cvo-knop-label { font-family: 'Calibri', 'Segoe UI', sans-serif; font-weight: 700; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.03em; color: #4d5554; line-height: 1.2; overflow-wrap: anywhere; hyphens: auto; }

    /* GSM: alle knoppen onder elkaar, compacter zodat ze binnen dezelfde iframe-hoogte passen */
    @media (max-width: 420px) {
      .cvo-knoppen-grid { grid-template-columns: minmax(0, 1fr); gap: 0.4rem; }
      .cvo-office-knop { min-height: 48px; gap: 0.75rem; padding: 0.35rem 0.8rem 0.35rem 0.9rem; }
      .cvo-hex-wrapper { width: 34px; height: 34px; }
      .cvo-knop-label { font-size: 0.8rem; letter-spacing: 0.01em; line-height: 1.15; overflow-wrap: normal; hyphens: manual; }
      .cvo-knop-sub { margin-top: 0.05rem; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="cvo-knoppen-grid">

  <a href="https://outlook.office.com/mail/" target="_blank" class="cvo-office-knop cvo-knop-outlook">
    <div class="cvo-hex-wrapper">
      <svg class="cvo-hex-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
        <polygon class="hex-bg" points="50,2 95,28 95,87 50,113 5,87 5,28"/>
        <rect x="28" y="38" width="44" height="32" rx="2" fill="none" stroke="#4d5554" stroke-width="4"/>
        <polyline points="28,40 50,60 72,40" fill="none" stroke="#4d5554" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cvo-knop-tekst">
      <span class="cvo-knop-label">Mijn berichten</span>
      <span class="cvo-knop-sub">Outlook e-mail</span>
    </div>
  </a>

  <a href="https://outlook.office.com/calendar/" target="_blank" class="cvo-office-knop cvo-knop-agenda">
    <div class="cvo-hex-wrapper">
      <svg class="cvo-hex-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
        <polygon class="hex-bg" points="50,2 95,28 95,87 50,113 5,87 5,28"/>
        <rect x="27" y="36" width="46" height="40" rx="2" fill="none" stroke="#4d5554" stroke-width="4"/>
        <line x1="27" y1="48" x2="73" y2="48" stroke="#4d5554" stroke-width="4"/>
        <line x1="38" y1="30" x2="38" y2="42" stroke="#4d5554" stroke-width="4" stroke-linecap="round"/>
        <line x1="62" y1="30" x2="62" y2="42" stroke="#4d5554" stroke-width="4" stroke-linecap="round"/>
        <rect x="36" y="55" width="8" height="7" rx="1" fill="#4d5554"/>
        <rect x="56" y="55" width="8" height="7" rx="1" fill="#4d5554"/>
      </svg>
    </div>
    <div class="cvo-knop-tekst">
      <span class="cvo-knop-label">Mijn agenda</span>
      <span class="cvo-knop-sub">Outlook kalender</span>
    </div>
  </a>

  <a href="https://cvocrescendo-my.sharepoint.com" target="_blank" class="cvo-office-knop cvo-knop-onedrive">
    <div class="cvo-hex-wrapper">
      <svg class="cvo-hex-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
        <polygon class="hex-bg" points="50,2 95,28 95,87 50,113 5,87 5,28"/>
        <path d="M35,70 Q22,70 22,58 Q22,48 32,46 Q33,34 45,34 Q55,34 58,43 Q70,42 72,52 Q80,52 80,61 Q80,70 68,70 Z" fill="none" stroke="#4d5554" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cvo-knop-tekst">
      <span class="cvo-knop-label">Mijn OneDrive</span>
      <span class="cvo-knop-sub">Persoonlijke opslag</span>
    </div>
  </a>

  <a href="https://www.office.com/launch/sharepoint" target="_blank" class="cvo-office-knop cvo-knop-sharepoint">
    <div class="cvo-hex-wrapper">
      <svg class="cvo-hex-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
        <polygon class="hex-bg" points="50,2 95,28 95,87 50,113 5,87 5,28"/>
        <polygon points="50,30 55,44 70,44 59,53 63,68 50,59 37,68 41,53 30,44 45,44" fill="none" stroke="#4d5554" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cvo-knop-tekst">
      <span class="cvo-knop-label">Favoriete sites</span>
      <span class="cvo-knop-sub">SharePoint startpagina</span>
    </div>
  </a>

  <a href="https://teams.microsoft.com" target="_blank" rel="noopener" class="cvo-office-knop cvo-knop-teams">
    <div class="cvo-hex-wrapper">
      <svg class="cvo-hex-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
        <polygon class="hex-bg" points="50,2 95,28 95,87 50,113 5,87 5,28"/>
        <circle cx="38" cy="44" r="8" fill="none" stroke="#4d5554" stroke-width="4"/>
        <circle cx="62" cy="44" r="8" fill="none" stroke="#4d5554" stroke-width="4"/>
        <path d="M24,72 Q24,58 38,58 Q48,58 51,64" fill="none" stroke="#4d5554" stroke-width="4" stroke-linecap="round"/>
        <path d="M76,72 Q76,58 62,58 Q52,58 49,64" fill="none" stroke="#4d5554" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cvo-knop-tekst">
      <span class="cvo-knop-label">Mijn Teams</span>
      <span class="cvo-knop-sub">Teams, chats en kanalen</span>
    </div>
  </a>

</div>

</body>
</html>
