<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; font-family: 'Calibri', 'Segoe UI', sans-serif; }
    .cvo-banner-wrapper { width: 100%; background-color: #f7f8f6; border: 1px solid #d8d8d8; color: #4d5554; overflow: hidden; }
    .cvo-banner-inner { display: flex; align-items: center; gap: 1.1rem; padding: 0.8rem 1.4rem; }
    .cvo-banner-hex { flex-shrink: 0; width: 50px; height: 41px; }
    .cvo-banner-tekst { flex: 1; min-width: 0; }
    .cvo-banner-titel { font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: #4d5554; margin-bottom: 0.15rem; }
    .cvo-banner-bericht { font-size: 0.9rem; font-weight: 400; color: #666e6d; line-height: 1.4; }
    .cvo-banner-accent { color: #4d5554; font-weight: 700; }
    .cvo-banner-streep { width: 100%; height: 4px; background: linear-gradient(to right, #a28790, #889a91, #4a4247); }
  </style>
</head>
<body>
  <div class="cvo-banner-wrapper">
    <div class="cvo-banner-streep"></div>
    <div class="cvo-banner-inner">
      <svg class="cvo-banner-hex" viewBox="0 0 130 115" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="45,2 90,28 90,87 45,113 0,87 0,28" fill="#889a91"/>
        <path d="M26,58 L39,72 L65,41" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="110,10 128,20 128,41 110,51 92,41 92,20" fill="#a28790"/>
        <polygon points="110,64 128,74 128,95 110,105 92,95 92,74" fill="#dacfd3"/>
      </svg>
      <div class="cvo-banner-tekst">
        <div class="cvo-banner-titel">Welkom op je vernieuwde portaal</div>
        <div class="cvo-banner-bericht">
          Het medewerkersportaal van Crescendo CVO is <span class="cvo-banner-accent">vernieuwd en vanaf nu live</span>. Alles wat je nodig hebt, vind je voortaan op één plek. Fijn dat je er bent!
        </div>
      </div>
    </div>
  </div>
</body>
</html>
